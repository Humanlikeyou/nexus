[package]
name = "amara-router"
version = "0.1.0"
edition = "2021"
description = "Local fast/deep model router for Amara (OpenAI- and Ollama-compatible)"
publish = false

# Standalone crate: not part of any parent workspace.
[workspace]

[[bin]]
name = "amara-router"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
futures = "0.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-stream = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
