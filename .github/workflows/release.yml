name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      # Notarization needs the App Store Connect key as a FILE (APPLE_API_KEY_PATH). The .p8
      # contents live in the APPLE_API_PRIVATE_KEY secret; write them to a 0600 temp file and
      # pass its path. Skipped (unsigned build) while the secret is unset.
      - name: Write App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$APPLE_API_PRIVATE_KEY" ]; then
            echo "APPLE_API_PRIVATE_KEY not set; building without notarization"
            exit 0
          fi
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID:-nexus}.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing + notarization. NOT SET YET: until Taisun adds these repo
          # secrets, builds are unsigned and not notarized.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Nexus v__VERSION__"
          releaseBody: "Draft release. See the assets below."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
          # No updater yet (no updater artifacts / signing key).

      - name: Remove App Store Connect API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
