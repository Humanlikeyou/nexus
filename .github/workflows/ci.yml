name: CI

on:
  push:
    branches: [main, nexus-v2]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend: type-check, tests, build ───────────────────────────────────
  frontend:
    name: Frontend (check:secrets + tsc + tests + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc" # Node 22 (>=22.6 for --experimental-strip-types)
          cache: "npm"
      - run: npm ci
      - name: Secrets gate
        run: npm run check:secrets
      - name: Type check
        run: npx tsc --noEmit
      # npm test minus cargo test (the rust job runs that with the Tauri system deps).
      - name: Unit tests
        run: npm run test:unit
      - name: Neuro tests
        run: npm run test:neuro
      - name: Build
        run: npm run build

  # ── Rust backend (Linux): fmt, clippy, test ──────────────────────────────
  rust:
    name: Rust (fmt + clippy + test, Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev pkg-config
      # Pinned to the toolchain verified locally (rustc 1.93.0).
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri's build script needs the frontend dist dir to exist.
      - name: Stub frontend dist
        working-directory: .
        run: mkdir -p dist
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked

  # ── Rust backend (macOS): build + test ───────────────────────────────────
  rust-macos:
    name: Rust (build + test, macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # Pinned to the toolchain verified locally (rustc 1.93.0).
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Stub frontend dist
        working-directory: .
        run: mkdir -p dist
      - name: cargo build
        run: cargo build --locked
      - name: cargo test
        run: cargo test --locked

  # ── amara-router (standalone crate, own Cargo.lock): fmt, clippy, test, build
  amara-router:
    name: amara-router (fmt + clippy + test + build, Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amara-router
    steps:
      - uses: actions/checkout@v4
      # Pinned to the toolchain verified locally (rustc 1.93.0).
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: amara-router
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked
      - name: cargo build
        run: cargo build --locked

  # ── Crew service: pytest in a test image built from the crew image ───────
  crew:
    name: Crew (pytest in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build crew base image
        run: docker build -t crew-base stack/crew-service
      - name: Build crew test image
        run: docker build -f stack/crew-service/Dockerfile.test --build-arg BASE=crew-base -t crew-test stack/crew-service
      # Dummy env only (CREW_ALLOWED_TOOLS from the image); no key: the tests assert none is set.
      - name: pytest
        run: docker run --rm --network none crew-test pytest -q -p no:cacheprovider
      # A fake key generated here (never stack/.env.crew): both read-only tools register.
      - name: Ingress tools register with a key
        run: |
          fake="$(openssl rand -base64 48 | tr '+/' '-_' | tr -d '=')"
          echo "::add-mask::$fake"
          docker run --rm --network none -e CREW_INGRESS_SECRET="$fake" crew-test python -c "
          import main
          assert sorted(main.TOOL_REGISTRY) == ['kb_query', 'memory_query'], sorted(main.TOOL_REGISTRY)
          assert main.ALLOWED_TOOLS == frozenset({'kb_query', 'memory_query'}), main.ALLOWED_TOOLS
          print('kb_query + memory_query registered and allowed')
          "

  # ── E2E: built console in Chromium with mocked Tauri IPC ─────────────────
  e2e:
    name: E2E (Playwright Chromium, light + dark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc" # Node 22
          cache: "npm"
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: npm run test:e2e
        run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
