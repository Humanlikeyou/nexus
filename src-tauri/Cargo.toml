[package]
name = "nexus"
version = "0.1.0"
description = "Nexus — Taisun's local command center"
authors = ["Taisun"]
edition = "2021"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
btleplug = "0.11"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
glob = "0.3"
futures = "0.3"
lazy_static = "1"
hostname = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
tar = "0.4"
flate2 = "1"
libc = "0.2"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree via tauri/tao; used only to set the Dock icon (dock_icon.rs).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
