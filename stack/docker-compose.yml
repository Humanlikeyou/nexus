# Terrance Intelligence Stack — Sprint 1
# Security baseline:
#   - All host ports bound to 127.0.0.1 (localhost-only, no LAN exposure)
#   - Telemetry disabled on every service that supports it
#   - All credentials sourced from .env — never hardcoded here
#   - Data volumes live under ./data/ (covered by macOS FileVault)

x-logging: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Shared PostgreSQL + pgvector ────────────────────────────────────────────
  postgres:
    # PG17 (n8n 2.x requires 17+). Migrated from PG15 via pg_dumpall/restore on 2026-10-21;
    # the old PG15 data dir ./data/postgres is kept untouched as a rollback source.
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    logging: *log
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: terrance
    volumes:
      - ./data/postgres17:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── n8n — Automation Backbone ───────────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.5
    restart: unless-stopped
    logging: *log
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_db
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Encryption — all workflow credentials encrypted at rest
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"         # HTTP-only on localhost, no HTTPS needed
      # Telemetry — all off
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"    # stops phone-home for template list
      N8N_SENTRY_DSN: ""
      EXTERNAL_FRONTEND_HOOKS_URLS: ""
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      # Runtime
      N8N_HOST: "0.0.0.0"               # binds inside container; host port locked to 127.0.0.1 above
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: "http://localhost:5678/"
      GENERIC_TIMEZONE: ${TIMEZONE:-America/Los_Angeles}
      # Stage 3 — downstream service URLs (Docker-internal; used by Code nodes)
      LETTA_URL:     "http://letta:8283"
      VERBA_URL:     "http://verba:8000"
      WEAVIATE_URL:  "http://weaviate:8080"
      # Code nodes must not read container env. Ingress auth (X-Nexus-Secret) and the Letta
      # Bearer token live in encrypted n8n credentials (Header Auth), created from .env by
      # scripts/n8n_sync_credentials.sh — never in n8n's environment.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    volumes:
      - ./data/n8n:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Letta (MemGPT) — Agent Long-Term Memory ─────────────────────────────────
  letta:
    # 0.16.8 = last Python Letta server image (newer tags are "Letta Code", incompatible).
    # Known CVEs accepted for localhost single-user use — see stack/SECURITY-NOTES.md.
    image: letta/letta:0.16.8
    restart: unless-stopped
    logging: *log
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8283:8283"   # REST API + ADE web UI (both on same port)
    environment:
      # Dedicated role limited to letta_db (scripts/postgres_letta_role.sh) — not the superuser.
      LETTA_PG_URI: "postgresql://${LETTA_DB_USER:-letta_app}:${LETTA_DB_PASSWORD:?set LETTA_DB_PASSWORD in .env}@postgres:5432/letta_db"
      # Require a password on the Letta REST API / ADE
      SECURE: "true"
      LETTA_SERVER_SECURE: "true"
      LETTA_SERVER_PASSWORD: ${LETTA_SERVER_PASSWORD:?set LETTA_SERVER_PASSWORD in .env}
      # Blank the image's built-in default creds for its bundled (unused) Postgres
      POSTGRES_USER: ""
      POSTGRES_PASSWORD: ""
      # Local LLMs only — no cloud provider keys in Letta's env (tool sandboxes inherit it, CVE-2026-77938)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      # Telemetry off
      LETTA_TELEMETRY: "false"
      SENTRY_DSN: ""
    volumes:
      - ./data/letta:/root/.letta

  # ── Weaviate — Vector Store (backing Verba) ─────────────────────────────────
  weaviate:
    # 1.24 -> 1.40 must step one minor at a time on existing data (Raft migration at 1.25).
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.1
    restart: unless-stopped
    logging: *log
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: weaviate
      DISABLE_TELEMETRY: "true"          # Weaviate-native telemetry flag
    volumes:
      - ./data/weaviate:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Verba — RAG Knowledge Base ──────────────────────────────────────────────
  # Optional: `docker compose --profile kb up -d`. The core stack starts without it;
  # kb.query then returns "knowledge base not running". Source: VERBA_SRC (default: the
  # archived checkout in ~/projects/terrance-integrations/Verba).
  verba:
    profiles: ["kb"]
    build:
      context: ${VERBA_SRC:-../../terrance-integrations/Verba}
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *log
    depends_on:
      weaviate:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"   # 8001 avoids conflict if Windmill added later
    environment:
      WEAVIATE_URL_VERBA: "http://weaviate:8080"   # internal Docker network
      # LLM / embedding backends
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:latest}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    volumes:
      - ./data/verba:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── CrewAI — Multi-Agent Ingress ────────────────────────────────────────────
  crew:
    build:
      context: ./crew-service
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *log
    # tini as PID 1 reaps grandchildren of stopped runs (uvicorn as PID 1 would leave zombies).
    init: true
    ports:
      - "127.0.0.1:8400:8400"
    depends_on:
      postgres:
        condition: service_healthy
    # CREW_INGRESS_SECRET only (read-only Ingress key: kb.query + memory.query), written from .env
    # by scripts/sync-crew-env.sh. Not .env itself: the crew must never see NEXUS_SECRET.
    # Missing file = no secret = the kb_query/memory_query tools are not registered.
    env_file:
      - path: ./.env.crew
        required: false
    environment:
      # Bind all interfaces *inside* the container; the host port above is 127.0.0.1-only.
      CREW_SERVICE_HOST: "0.0.0.0"
      CREW_SERVICE_PORT: "8400"
      CREW_SERVICE_TOKEN: ${CREW_SERVICE_TOKEN:?set CREW_SERVICE_TOKEN in .env}
      # Per-launch token as a second accepted credential (static X-Crew-Token stays valid).
      CREW_ACCEPT_LAUNCH_TOKEN: "1"
      CREW_LAUNCH_TOKEN_FILE: /run/amara/launch_token
      CREW_MAX_TASK_CHARS: ${CREW_MAX_TASK_CHARS:-4000}
      CREW_MAX_CONCURRENT: ${CREW_MAX_CONCURRENT:-1}
      CREW_RUN_TIMEOUT_SECONDS: ${CREW_RUN_TIMEOUT_SECONDS:-900}
      CREW_ALLOWED_NAMES: ${CREW_ALLOWED_NAMES:-}
      # Tools: allowlist (empty = none) and the read-only Ingress webhook they call
      CREW_ALLOWED_TOOLS: ${CREW_ALLOWED_TOOLS:-}
      CREW_INGRESS_URL: ${CREW_INGRESS_URL:-http://n8n:5678/webhook/terrance/ingress-crew}
      # LLM — every model call goes through the Amara Router (OpenAI /v1); tier by model alias
      # (amara-fast / amara-deep) plus X-Amara-Route. Never Ollama directly.
      CREW_ROUTER_URL: ${CREW_ROUTER_URL:-http://host.docker.internal:8787/v1}
      CREW_ROUTER_KEY: ${CREW_ROUTER_KEY:-}
      CREW_DEEP_WAIT_MAX_SECONDS: ${CREW_DEEP_WAIT_MAX_SECONDS:-300}
      # R13-F signed n8n trigger: CREW_TRIGGER_SECRET is read from .env.crew (env_file) only. It is
      # deliberately NOT listed here: an `environment:` entry would override env_file with a blank.
      # Unset = endpoint disabled (every call 403).
      # 1110i files/terminal sandbox: UNSET = the tools do not exist. TAISUN step, see tasks/active/D-1110i.md:
      #   CREW_SANDBOX_ROOT: /crew-sandbox    and under `volumes:`  - ${HOME}/crew-sandbox:/crew-sandbox
      # R13-E (optional, mapped app-data folders): CREW_MEMORY_WRITER=file, CREW_MEMORY_DIR=/crew-memory, CREW_SKILLS_DIR=/crew-skills
      # No cloud path here (MiniMax removed). The kill switch also blocks any future Claude tier.
      NEXUS_OUTBOUND_DISABLED: ${NEXUS_OUTBOUND_DISABLED:-}
      # Persistence — crew_runs table in the shared terrance DB
      CREW_DB_HOST: postgres
      CREW_DB_PORT: "5432"
      CREW_DB_NAME: terrance
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Telemetry off
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
    # The app's run dir (launch_token), read-only. Mount the directory so the per-launch rename is seen.
    volumes:
      - ${HOME}/Library/Application Support/com.taisun.nexus/run:/run/amara:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8400/health"]
      interval: 15s
      timeout: 5s
      retries: 5
